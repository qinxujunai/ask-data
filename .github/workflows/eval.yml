name: Eval

# Asks the model every verified question (each held out of retrieval) and records how many results
# match, with and without retrieval. Needs the DEEPSEEK_API_KEY secret. Run by hand.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-db.mjs
      - run: node scripts/eval.mjs
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval
          git diff --cached --quiet || { git commit -m "Eval report $(date -u +%F)"; git push; }
